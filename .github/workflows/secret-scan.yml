name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan for known private tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: grep for token-shaped strings
        run: |
          set -e
          patterns='sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36}|xox[abp]-[A-Za-z0-9-]+|BEGIN RSA PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY'
          if grep -RInE "$patterns" \
              --exclude-dir=.git \
              --exclude-dir=.github \
              --exclude-dir=venv \
              --exclude-dir=__pycache__ \
              --exclude-dir=node_modules \
              . ; then
            echo "::error::Possible secret found in the repo"
            exit 1
          fi
          echo "No secret-shaped strings found."
